<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="민지의 다이어리 일기보관함" />
    <title>민지의 다이어리</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page" id="top">
      <header class="site-header" data-node-id="3:122">
        <div class="container header__inner" data-node-id="3:123">
          <a class="logo" href="#diary" aria-label="민지의 다이어리 홈">민지의 다이어리</a>

          <label class="theme-switch" for="theme-toggle">
            <span>다크모드</span>
            <input id="theme-toggle" type="checkbox" role="switch" aria-label="다크모드 전환" />
            <span class="theme-switch__track" aria-hidden="true">
              <span class="theme-switch__knob"></span>
            </span>
          </label>
        </div>
      </header>

      <main>
        <div id="library-view">
          <section class="container hero" data-node-id="3:130">
            <img src="../assets/hero.png" alt="쿠션 위에 누워 있는 반려동물" />
          </section>

          <section class="container content" data-node-id="3:132">
            <nav class="tabs" aria-label="다이어리 메뉴" data-node-id="3:136">
              <button class="tab tab--active" type="button" data-view="diary" aria-current="page">일기보관함</button>
              <button class="tab" type="button" data-view="photos" aria-current="false">사진보관함</button>
            </nav>

            <div class="view-panel" id="photos-panel" data-view-panel="photos" hidden>
              <div class="toolbar">
                <label class="select-wrap" for="ratio-select">
                  <span class="sr-only">사진 비율 선택</span>
                  <select id="ratio-select">
                    <option value="square">기본</option>
                    <option value="wide">가로형</option>
                    <option value="portrait">세로형</option>
                  </select>
                  <img src="../assets/arrow-down.svg" alt="" aria-hidden="true" />
                </label>
              </div>

              <div class="gallery gallery--square" id="gallery" aria-live="polite" data-node-id="3:146"></div>
            </div>

            <div class="view-panel" id="diary-panel" data-view-panel="diary">
              <div class="diary-toolbar">
                <div class="diary-toolbar__filters">
                  <label class="select-wrap select-wrap--small" for="mood-select">
                    <span class="sr-only">감정 필터</span>
                    <select id="mood-select">
                      <option value="all">전체</option>
                      <option value="sad">슬퍼요</option>
                      <option value="surprised">놀랐어요</option>
                      <option value="angry">화나요</option>
                      <option value="happy">행복해요</option>
                    </select>
                    <img src="../assets/arrow-down.svg" alt="" aria-hidden="true" />
                  </label>
                  <label class="search-wrap" for="diary-search">
                    <img src="../assets/search.svg" alt="" aria-hidden="true" />
                    <input id="diary-search" type="search" placeholder="검색어를 입력해 주세요." />
                  </label>
                </div>
                <button class="write-button" id="write-button" type="button">
                  <img src="../assets/add.svg" alt="" aria-hidden="true" />
                  일기쓰기
                </button>
              </div>
              <div class="diary-grid" id="diary-grid" aria-live="polite"></div>
              <nav class="pagination" id="pagination" aria-label="일기 목록 페이지">
                <button class="pagination__arrow" id="previous-page" type="button" aria-label="이전 페이지">
                  <img src="../assets/chevron-right.svg" alt="" aria-hidden="true" />
                </button>
                <div class="pagination__numbers" id="page-numbers"></div>
                <button class="pagination__arrow" id="next-page" type="button" aria-label="다음 페이지">
                  <img src="../assets/chevron-left.svg" alt="" aria-hidden="true" />
                </button>
              </nav>
            </div>
          </section>
        </div>

      </main>

      <footer class="site-footer">
        <div class="container footer__inner">
          <strong>민지의 다이어리</strong>
          <p>대표 : {name}</p>
          <small>Copyright © 2024. {name} Co., Ltd.</small>
        </div>
      </footer>

      <button class="scroll-top" id="scroll-top" type="button" aria-label="맨 위로 이동">
        <img src="../assets/scroll-top.svg" alt="" aria-hidden="true" />
      </button>

      <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>

    <dialog class="write-dialog" id="write-dialog" aria-labelledby="write-dialog-title">
      <form class="write-dialog__card" id="write-form" method="dialog">
        <h2 id="write-dialog-title">일기 쓰기</h2>
        <fieldset class="mood-field">
          <legend>오늘 기분은 어땠나요?</legend>
          <div class="mood-options">
            <label><input type="radio" name="write-mood" value="sad" checked />슬퍼요</label>
            <label><input type="radio" name="write-mood" value="surprised" />놀랐어요</label>
            <label><input type="radio" name="write-mood" value="angry" />화나요</label>
            <label><input type="radio" name="write-mood" value="happy" />행복해요</label>
          </div>
        </fieldset>
        <label class="form-field">
          <span>제목</span>
          <input name="title" type="text" placeholder="제목을 입력해 주세요." required />
        </label>
        <label class="form-field">
          <span>내용</span>
          <textarea name="content" placeholder="내용을 입력해 주세요." required></textarea>
        </label>
        <div class="write-dialog__actions">
          <button class="dialog-button dialog-button--secondary" type="button" id="close-dialog">닫기</button>
          <button class="dialog-button dialog-button--primary" id="submit-diary" type="submit">등록하기</button>
        </div>
      </form>
    </dialog>

    <dialog class="feedback-dialog" id="cancel-dialog" aria-labelledby="cancel-dialog-title">
      <div class="feedback-dialog__card">
        <h2 id="cancel-dialog-title">일기 쓰기 취소</h2>
        <p id="cancel-dialog-message">작성 중인 내용이 저장되지 않습니다.<br />취소하시겠습니까?</p>
        <div class="feedback-dialog__actions">
          <button class="dialog-button dialog-button--secondary" id="keep-writing" type="button">취소</button>
          <button class="dialog-button dialog-button--primary" id="discard-writing" type="button">확인</button>
        </div>
      </div>
    </dialog>

    <dialog class="feedback-dialog" id="success-dialog" aria-labelledby="success-dialog-title">
      <div class="feedback-dialog__card">
        <h2 id="success-dialog-title">등록 완료</h2>
        <p id="success-dialog-message">일기가 등록되었습니다.</p>
        <div class="feedback-dialog__actions">
          <button class="dialog-button dialog-button--primary" id="close-success" type="button">확인</button>
        </div>
      </div>
    </dialog>

    <dialog class="feedback-dialog" id="delete-dialog" aria-labelledby="delete-dialog-title">
      <div class="feedback-dialog__card">
        <h2 id="delete-dialog-title">일기 삭제</h2>
        <p>일기를 삭제하시겠습니까?</p>
        <div class="feedback-dialog__actions">
          <button class="dialog-button dialog-button--secondary" id="cancel-delete" type="button">취소</button>
          <button class="dialog-button dialog-button--primary" id="confirm-delete" type="button">삭제</button>
        </div>
      </div>
    </dialog>

    <p class="sr-only" id="status-message" role="status"></p>
    <script src="./script.js"></script>
  </body>
</html>
