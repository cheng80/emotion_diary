<!DOCTYPE html>
<html lang="ko">
	<head>
		<!-- 문서 설정 -->
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>택권의 다이어리</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<!-- 헤더 -->
		<div class="site-header">
			<div class="page header-inner">
				<!-- 다이어리 이름 -->
				<div class="logo">택권의 다이어리</div>

				<!-- 다크모드 선택 -->
				<label class="theme-switch">
					<span>다크모드</span>
					<input id="theme-toggle" type="checkbox" onchange="changeTheme(event)" />
				</label>
			</div>
		</div>

		<!-- 일기 목록 -->
		<div class="page">
			<!-- 배너 -->
			<section class="banner">
				<img src="../assets/hero.jpg" />
			</section>

			<!-- 08/10 과제: JavaScript 컴포넌트로 일기보관함과 사진보관함을 표시 -->
			<section class="content" id="library-content"></section>
		</div>

		<!-- 푸터 -->
		<div class="site-footer">
			<div class="page footer-inner">
				<strong>택권의 다이어리</strong>
				<p>대표 : 김택권</p>
				<p class="copyright">Copyright © 2024. 김택권 Co., Ltd.</p>
			</div>
		</div>

		<!-- 08/05 과제·08/06 과제: 맨 위로 이동하는 고정 버튼 -->
		<button class="scroll-top" type="button" onclick="scrollToTop()">
			<img src="../assets/scroll-top.svg" />
		</button>

		<!-- 08/07 과제: 일기 작성 모달 -->
		<div class="modal-background" id="write-modal" onclick="closeWriteModal()">
			<div class="write-modal" onclick="event.stopPropagation()">
				<div class="modal-heading">
					<h2 class="modal-title" id="write-modal-title">일기 쓰기</h2>
					<!-- 08/11 과제: 일기 등록 모달의 다크모드 토글 -->
					<label class="theme-switch modal-theme-switch">
						<span>다크모드</span>
						<input type="checkbox" onchange="changeTheme(event)" />
					</label>
				</div>

				<!-- 감정 선택 -->
				<div class="field-group">
					<div class="field-label">오늘 기분은 어땠나요?</div>
					<div class="mood-options">
						<label><input id="write-happy" type="radio" name="write-mood" checked /> 행복해요</label>
						<label><input id="write-sad" type="radio" name="write-mood" /> 슬퍼요</label>
						<label><input id="write-surprised" type="radio" name="write-mood" /> 놀랐어요</label>
						<label><input id="write-angry" type="radio" name="write-mood" /> 화나요</label>
					</div>
				</div>

				<!-- 제목 입력 -->
				<div class="field-group">
					<label class="field-label" for="write-title">제목</label>
					<input class="title-input" id="write-title" type="text" placeholder="제목을 입력해 주세요." oninput="checkWriteButton()" />
				</div>

				<!-- 내용 입력 -->
				<div class="field-group">
					<label class="field-label" for="write-content">내용</label>
					<textarea class="content-input" id="write-content" placeholder="내용을 입력해 주세요." oninput="checkWriteButton()"></textarea>
				</div>

				<!-- 모달 버튼 -->
				<div class="modal-buttons">
					<button class="close-button" type="button" onclick="closeWriteModal()">닫기</button>
					<button class="submit-button" id="write-submit" type="button" onclick="submitDiary()" disabled>등록하기</button>
				</div>
			</div>
		</div>

		<!-- 08/07 과제: 일기 작성 취소 확인 모달 -->
		<div class="modal-background" id="cancel-modal" onclick="keepWriting()">
			<div class="message-modal" onclick="event.stopPropagation()">
				<h2 id="cancel-modal-title">일기 작성을 취소할까요?</h2>
				<div class="modal-buttons">
					<button class="close-button" type="button" onclick="keepWriting()">계속 작성</button>
					<button class="submit-button" id="cancel-confirm" type="button" onclick="discardWriting()">작성 취소</button>
				</div>
			</div>
		</div>

		<!-- 08/07 과제: 등록 완료 중첩 모달 -->
		<div class="modal-background" id="success-modal" onclick="closeSuccessModal()">
			<div class="message-modal" onclick="event.stopPropagation()">
				<h2>등록이 완료되었습니다.</h2>
				<div class="modal-buttons">
					<button class="submit-button" type="button" onclick="closeSuccessModal()">확인</button>
				</div>
			</div>
		</div>

		<!-- 08/05 과제·08/07 과제: 목록·상세 공용 삭제 확인 모달 -->
		<div class="modal-background" id="delete-modal" onclick="closeDeleteModal()">
			<div class="message-modal" onclick="event.stopPropagation()">
				<h2>이 일기를 삭제할까요?</h2>
				<div class="modal-buttons">
					<button class="close-button" type="button" onclick="closeDeleteModal()">취소</button>
					<button class="submit-button" type="button" onclick="confirmDeleteDiary()">삭제</button>
				</div>
			</div>
		</div>

		<!-- 토스트 메시지 -->
		<div class="toast-area" id="toast-area"></div>

		<!-- 자바스크립트 연결 -->
		<script src="./script.js"></script>
	</body>
</html>
